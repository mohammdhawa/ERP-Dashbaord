      boxicons from unpkg, and @tabler/icons + @tabler/icons-webfont from

      file that did is components/ads/Features.jsx, which is not routed. The two
      Tabler URLs were also pinned to @latest, letting a third party change what
      ships to users without a deploy. Removed: the app renders its icons from
      the bundled Remix Icon and Bootstrap Icons fonts.
    -->
